  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="logo"><b>q</b><i>·</i>sketch</div>
      <div class="tag">a q/kdb+ interpreter and a canvas, entirely in your browser</div>
      <div class="track"><div class="bar" id="boot-bar"></div></div>
      <div class="status" id="boot-status">loading…</div>
      <pre class="err" id="boot-err"></pre>
      <button class="retry" onclick="location.reload()">reload</button>
    </div>

    <script>
      // progress reporting, available before the bundle has parsed
      (function () {
        var bar = document.getElementById('boot-bar');
        var status = document.getElementById('boot-status');
        var box = document.getElementById('boot');
        var err = document.getElementById('boot-err');
        var done = false;
        var pct = 0;
        window.__boot = {
          step: function (p, label) {
            if (done) return;
            pct = Math.max(pct, p);
            bar.style.width = pct + '%';
            if (label) status.textContent = label;
          },
          fail: function (msg) {
            done = true;
            box.classList.add('failed');
            box.classList.remove('gone');
            status.textContent = 'could not start';
            err.textContent = String(msg);
          },
          done: function () {
            if (done) return;
            done = true;
            bar.style.width = '100%';
            box.classList.add('gone');
            setTimeout(function () {
              box.style.display = 'none';
            }, 300);
          },
        };
        // resource failures do not bubble, so listen in the capture phase
        window.addEventListener(
          'error',
          function (e) {
            if (done) return;
            var t = e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              if (t.tagName === 'LINK') return; // a missing font is not fatal
              window.__boot.fail(
                'Could not download the application bundle.\n\nCheck your connection and reload — everything runs locally once it is here.'
              );
              return;
            }
            if (e.message || e.error) window.__boot.fail((e.error && e.error.stack) || e.message);
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          if (!done) window.__boot.fail((e.reason && (e.reason.stack || e.reason.message)) || e.reason);
        });
        // watchdogs: reassure, then give up with something actionable
        setTimeout(function () {
          if (!done) window.__boot.step(pct, 'still loading — slow connection?');
        }, 6000);
        setTimeout(function () {
          if (!done && pct < 55) document.querySelector('#boot .retry').style.display = 'block';
        }, 12000);
        setTimeout(function () {
          if (!done)
            window.__boot.fail(
              'The app did not finish loading.\n\nThis is usually a flaky network. Reloading normally fixes it — everything runs locally in the browser once it is here.'
            );
        }, 25000);
        window.__boot.step(8, 'fetching the interpreter…');
      })();
    </script>

    <div id="app"></div>

    <!-- the code font is nice to have, not needed to paint -->
    <link
